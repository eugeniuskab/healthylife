version: '3.8'

services:
  # 1. Веб-сервер / Reverse Proxy (Входная точка для браузера)
  nginx:
    image: nginx:alpine
    container_name: healthylife_nginx
    ports:
      - "8080:80"  # Наружу открыт только веб-сервер
    volumes:
      # Монтируем код проекта, чтобы Nginx сам отдавал статику (css, js, img)
      - ./:/var/www/html:ro
      # Монтируем наш конфиг Nginx внутрь контейнера
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network
    restart: always

  # 2. Обработчик PHP (PHP-FPM)
  php:
    build: .
    container_name: healthylife_php
    # ports НЕТ! Наружу порт 9000 открывать нельзя и не нужно.
    environment:
      DB_HOST: db
      DB_NAME: healthylife
      DB_USER: healthylife_user
      DB_PASSWORD: userpassword
    volumes:
      # Монтируем код внутрь PHP-контейнера
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - app-network
    restart: always

  # 3. База данных (MySQL)
  db:
    image: mysql:8.0
    container_name: healthylife_db
    # ports НЕТ! Порт 3306 закрыт от интернета и доступен только внутри сети app-network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: healthylife
      MYSQL_USER: healthylife_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  db_data: